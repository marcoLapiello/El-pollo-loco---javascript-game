<!DOCTYPE html>
<html lang="sp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El pollo loco</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./Grafics/img/6_salsa_bottle/salsa_bottle.png" type="image/x-icon">
    <script src="./scripts/models/drawable-objects.class.js"></script>
    <script src="./scripts/models/movable-object.class.js"></script>
    <script src="./scripts/models/bottle.class.js"></script>
    <script src="./scripts/models/bottlesOnTheGround.class.js"></script>
    <script src="./scripts/models/coins.class.js"></script>
    <script src="./scripts/models/cloud.class.js"></script>
    <script src="./scripts/models/character.class.js"></script>
    <script src="./scripts/models/chicken.class.js"></script>
    <script src="./scripts/models/keyboard.class.js"></script>
    <script src="./scripts/models/world.class.js"></script>
    <script src="./scripts/models/background.class.js"></script>
    <script src="./scripts/models/statusBars.class.js"></script>
    <script src="./scripts/models/level.class.js"></script>
    <script src="./scripts/models/endboss.class.js"></script>
    <script src="./scripts/levels/level1.js"></script>
    <script src="./scripts/game.js"></script>
</head>
<body onload="init()">
    <section class="mainContent">
        <h1>El pollo loco</h1>
        <canvas id="canvas" width="720" height="480"></canvas>
        <div class="instructions">
            <div class="instructions">
                <div class="singleInstruction">
                    <img class="arrow" src="./Grafics/arrow_left.png" alt="">
                    <span>move left</span>
                </div>
                <div class="separator"></div>
                <div class="singleInstruction reverse">
                    <img class="arrow" src="./Grafics/arrow_right.png" alt="">
                    <span>move right</span>
                </div>
            </div>
            <div class="instructions">
                <div class="singleInstruction">
                    <span class="btnName">Space</span>
                    <span>jump</span>
                </div>
                <div class="separator"></div>
                <div class="singleInstruction reverse">
                    <span class="btnName">B</span>
                    <span>throw bottle</span>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
