<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <title>El pollo loco</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="./Grafics/img/6_salsa_bottle/salsa_bottle.png" type="image/x-icon" />
    <script type="module" src="./scripts/game.js"></script>
  </head>
  <body>
    <section id="mainContent" class="mainContent">
      <h1>El pollo loco</h1>

      <div id="canvasContainer" class="canvasContainer">
        <div id="startScreen" class="startScreen">
          <button id="startButton">START</button>
        </div>

        <button id="menuBtn" class="menuBtn"></button>
        <button id="pauseBtn" class="pauseBtn dNone"></button>
        <button id="soundBtn" class="soundBtn dNone"></button>

        <button id="leftBtn" class="leftBtn dNone">L</button>
        <button id="rightBtn" class="rightBtn dNone">R</button>
        <button id="jumpBtnLeft" class="jumpBtnLeft dNone">J</button>
        <button id="throwBtnLeft" class="throwBtnLeft dNone">B</button>
        <button id="jumpBtnRight" class="jumpBtnRight dNone">J</button>
        <button id="throwBtnRight" class="throwBtnRight dNone">B</button>

        <canvas class="dNone" id="canvas" width="720" height="480"></canvas>

        <div id="menu" class="menu dNone">
          <button id="menuBackBtn" class="menuBackBtn">Close</button>
          <button id="menuImprintBtn" class="menuImprintBtn"></button>

          <p id="gameDescription" class="gameDescription"></p>
          <div id="controls" class="controls"></div>
        </div>

        <div id="endScreen" class="endScreen dNone">
          <img id="endScreenImg" class="endScreenImg" src="" alt="" />
          <button id="resetButton" class="resetButton">Try Again</button>
        </div>

        
      </div>
      
    </section>
    <div id="mobileTurn" class="mobileTurn dNone">
      <!-- <button id="fullscreenBtn" class="fullscreenBtn dNone">Full Screen</button> -->
      <p class="turnAdvice">Please turn your device</p>
    </div>
  </body>
</html>
