<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <title>El pollo loco</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="./Grafics/img/6_salsa_bottle/salsa_bottle.png" type="image/x-icon" />
    <script type="module" src="./scripts/game.js"></script>
  </head>
  <body>
    <section class="mainContent">
      <h1>El pollo loco</h1>

      <div id="canvasContainer" class="canvasContainer">
        <div id="startScreen" class="startScreen">
          <button id="startButton">START</button>
        </div>

        <button id="menuBtn" class="menuBtn"></button>
        <button id="pauseBtn" class="pauseBtn dNone"></button>
        <button id="soundBtn" class="soundBtn dNone"></button>

        <canvas class="dNone" id="canvas" width="720" height="480"></canvas>

        <div id="menu" class="menu dNone">
          <button id="menuBackBtn" class="menuBackBtn">BACK</button>
          <button id="menuImprintBtn" class="menuImprintBtn">Imprint</button>

          <p id="gameDescription" class="gameDescription">
            <h2 id="descriptionTitle">WHAT´S GOING ON??</h2>
            <span id="descriptionText" class="gameDescription">
              A horde of angry chickens, led by their alpha rooster, is advancing toward your ranch with the aim of pillaging it. Block their path and
              defeat them with blasts of spicy salsa!
            </span>
          </p>
          <div class="controls">
            <h3>CONTROLS</h3>
            <div class="instructions">
              <div class="instructions">
                <div class="singleInstruction">
                  <img class="arrow" src="./Grafics/arrow_left.png" alt="" />
                  <span>move left</span>
                </div>
                <div class="separator"></div>
                <div class="singleInstruction reverse">
                  <img class="arrow" src="./Grafics/arrow_right.png" alt="" />
                  <span>move right</span>
                </div>
              </div>

              <div class="instructions">
                <div class="singleInstruction">
                  <span class="btnName">Space</span>
                  <span>jump</span>
                </div>
                <div class="separator"></div>
                <div class="singleInstruction reverse">
                  <span class="btnName">B</span>
                  <span>throw bottle</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="endScreen" class="endScreen dNone">
          <img id="endScreenImg" class="endScreenImg" src="" alt="" />
          <button id="resetButton" class="resetButton">Try Again</button>
        </div>
      </div>
    </section>
  </body>
</html>
